<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suno Shuffle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div id="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a00"/><stop offset="1" stop-color="#ffcc00"/></linearGradient></defs><circle cx="12" cy="12" r="7.25" fill="none" stroke="url(#logo-grad)" stroke-width="5.5"/></svg>
      </div>
      <div id="app-name">Suno Shuffle</div>
    </header>

    <section id="now" class="card" aria-live="polite">
      <img id="now-art" alt="" hidden />
      <div id="now-text">
        <div id="now-label">Nothing queued yet</div>
        <div id="now-title"></div>
        <div id="now-meta"></div>
      </div>
    </section>

    <section id="target">
      <div id="target-label">This tab</div>
      <div id="target-name">—</div>
    </section>

    <div id="actions">
      <button id="btn-start" class="btn btn-primary" type="button">Shuffle this page</button>
      <button id="btn-resume" class="btn btn-secondary" type="button" hidden>Resume</button>
      <button id="btn-cancel-scan" class="btn btn-secondary" type="button" hidden>Stop scanning &amp; play</button>
    </div>

    <div id="message" role="status"></div>

    <p id="tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      <span><strong>Long playlist?</strong> Scroll to the bottom first so every song is loaded. The scan is then almost instant.</span>
    </p>

    <footer>
      <button id="btn-reset-pos" class="link" type="button">Reset player position</button>
      <span class="dot" aria-hidden="true">·</span>
      <button id="btn-clear" class="link link-danger" type="button">Clear history</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
